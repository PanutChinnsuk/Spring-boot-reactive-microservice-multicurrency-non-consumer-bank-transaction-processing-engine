server:
  port: 8006

spring:

  application:
    name: transactionservice


  r2dbc:
    url: r2dbc:mysql://localhost:3306/multicurrency_bank
    username: root
    password: a11211121A_

  kafka:
    admin:
      auto-create: false
      operation-timeout: 1
    properties:
      reconnect:
        backoff:
          max:
            ms: 5000
          ms: 2000
      metadata:
        recovery:
          strategy: NONE

    bootstrap-servers: localhost:9092
    consumer:
      group-id: transactionService




app:
  events:
    transactions:
      clearing:
        blacklistMinutes: 1
        applyingBlacklistMinutes: 2
        scheduleMinutes: 1
        scheduleMilliOffset: 10000
        sizeLimit: 100
        applyingSizeLimit: 300

  security:
    core:
      securityMode: TEST

      fxRateServiceKey: fxRateService
      accountServiceKey: accountService
      mySecretKey: transactionService
      apiKey: apiKey




eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8500/eureka/


